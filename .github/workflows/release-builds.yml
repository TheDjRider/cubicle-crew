# macOS и Linux сборки: при публикуван release (Windows инсталаторът се качва ръчно) GitHub строи
# macOS .dmg + .zip (universal: Intel + Apple Silicon) и Linux .AppImage и ги добавя към същия release.
# Може да се пусне и ръчно за вече съществуващ таг. Без Apple подпис: приложението е подписано ad-hoc
# (identity "-"), първото отваряне на Mac е с десен бутон → Open.
name: Desktop builds (macOS, Linux)

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag to build and attach to (e.g. v2.1.0)'
        required: true

permissions:
  contents: write

env:
  TAG: ${{ github.event.release.tag_name || inputs.tag }}

jobs:
  mac:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Build (unsigned, ad-hoc)
        run: npm run dist:mac
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      - name: Attach to the release
        run: gh release upload "$TAG" release/*.dmg release/*-mac.zip --clobber
        env:
          GH_TOKEN: ${{ github.token }}

  linux:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Build AppImage
        run: npm run dist:linux
      - name: Attach to the release
        run: gh release upload "$TAG" release/*.AppImage --clobber
        env:
          GH_TOKEN: ${{ github.token }}
