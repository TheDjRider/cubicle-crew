# macOS сборка: при публикуван release (Windows инсталаторът се качва ръчно) GitHub строи .dmg и .zip
# (universal: Intel + Apple Silicon) и ги добавя към същия release. Може да се пусне и ръчно за вече съществуващ таг.
# Без Apple подпис: приложението е подписано ad-hoc (identity "-"), първото отваряне е с десен бутон → Open.
name: macOS build

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag to build and attach to (e.g. v2.0.0)'
        required: true

permissions:
  contents: write

jobs:
  mac:
    runs-on: macos-14
    env:
      TAG: ${{ github.event.release.tag_name || inputs.tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Build (unsigned, ad-hoc)
        run: npm run dist:mac
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      - name: Attach to the release
        run: gh release upload "$TAG" release/*.dmg release/*-mac.zip --clobber
        env:
          GH_TOKEN: ${{ github.token }}
