# Демото в интернет: https://rezored.github.io/cubicle-crew/ – public/ като статичен сайт, винаги в ?demo
# (scripts/pages.mjs слага window.CC_WEB в index.html). При push в main, ако се промени клиентът.
name: Web demo (GitHub Pages)

on:
  push:
    branches: [main]
    paths: ['public/**', 'scripts/pages.mjs', 'docs/media/og.png', 'docs/media/trailer.mp4', '.github/workflows/pages.yml']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - run: node scripts/pages.mjs _site
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: _site
      - id: deploy
        uses: actions/deploy-pages@v5
