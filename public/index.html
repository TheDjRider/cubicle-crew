<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Cubicle Crew</title>
<link rel="icon" href="data:,">
<style>
  :root {
    --pod: 144px; --bubble-max: 180px; --label-max: 130px;
    --ui-bg: rgba(18, 14, 28, 0.86); --ui-border: #3a3452; --ui-text: #e8e2f8; --ui-dim: #9a92b8;
    --font: "Segoe UI", system-ui, -apple-system, Roboto, "Noto Sans", "Helvetica Neue", Arial, sans-serif;
    --mono: "Cascadia Mono", Consolas, "SF Mono", Menlo, "DejaVu Sans Mono", ui-monospace, monospace;
  }
  html, body { margin: 0; height: 100%; overflow: hidden; background: #0e0c14; color: var(--ui-text); font: 13px/1.35 var(--font); }
  #stage { position: fixed; left: 0; top: 0; }
  #c { display: block; image-rendering: pixelated; image-rendering: crisp-edges; }
  #overlay { position: absolute; left: 0; top: 0; pointer-events: none; overflow: hidden; }

  /* етикет под бюрото */
  .tag { position: absolute; left: 0; top: 0; display: flex; align-items: center; gap: 4px; max-width: var(--label-max);
    padding: 1px 6px 2px; border-radius: 3px; background: rgba(14, 10, 22, 0.78); border: 1px solid rgba(255,255,255,0.08);
    font-size: 12px; line-height: 15px; white-space: nowrap; color: #ece6fa; will-change: transform; transition: opacity .3s; }
  .tag i { flex: none; width: 7px; height: 7px; border-radius: 1px; box-shadow: 0 0 0 1px rgba(0,0,0,.5); }
  .tag .n { overflow: hidden; text-overflow: ellipsis; min-width: 0; }
  .tag .s { flex: none; color: var(--ui-dim); font-size: 11px; }
  .tag[data-state="waiting"] { background: #e04a6b; border-color: #ff9ab0; animation: pulse 0.64s steps(2) infinite; }
  .tag[data-state="waiting"] .s { color: #fff; font-weight: 600; }
  .tag.focus { outline: 2px solid #fff; }

  /* балонче над главата */
  .bubble { position: absolute; left: 0; top: 0; max-width: var(--bubble-max); padding: 2px 7px 3px; border-radius: 3px;
    background: #f6f3ea; color: #1d1626; border: 2px solid #1d1626; box-shadow: 2px 2px 0 rgba(0,0,0,.35);
    font: 12px/15px var(--mono); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; opacity: 0; transition: opacity .25s; will-change: transform; }
  .bubble.show { opacity: 1; }
  .bubble b { font-weight: 700; margin-right: 5px; }
  .bubble[data-state="typing"] { border-left: 5px solid #4ac26b; }
  .bubble[data-state="reading"] { border-left: 5px solid #4a8fe0; }
  .bubble[data-state="running"] { border-left: 5px solid #e07a4a; }
  .bubble[data-state="delegating"] { border-left: 5px solid #b04ae0; }
  .bubble[data-state="waiting"] { background: #e04a6b; color: #fff; border-color: #2a0a14; font-family: var(--font); font-weight: 600; }
  @keyframes pulse { 50% { filter: brightness(1.35); } }

  /* HUD */
  #hud { position: fixed; left: 8px; bottom: 8px; max-width: 48vw; display: flex; flex-wrap: wrap; gap: 6px; pointer-events: none; }
  #hud span { background: var(--ui-bg); border: 1px solid var(--ui-border); border-radius: 3px; padding: 2px 8px; box-shadow: 2px 2px 0 rgba(0,0,0,.3); }
  #hud b { color: #fff; }
  #hud .conn i { display: inline-block; width: 8px; height: 8px; border-radius: 50%; margin-right: 6px; background: #e0c24a; vertical-align: 0; }
  #hud .conn.connected i { background: #4ac26b; box-shadow: 0 0 6px #4ac26b; }
  #hud .conn.down i { background: #e04a6b; }
  #hud .conn.demo i { background: #b04ae0; }
  #hud .alert { background: #e04a6b; border-color: #ff9ab0; animation: pulse .64s steps(2) infinite; }
  /* токени: монетата е 5x5 пиксела, рисувана в tokens.js */
  #hud .tok { border-color: #7a5410; }
  #hud .tok i { display: inline-block; width: 10px; height: 10px; margin-right: 5px; vertical-align: -1px; background-size: 100% 100%; image-rendering: pixelated; }
  #hud .tok b { color: #ffe27a; }
  #hud .tok.gain { background: #5a4214; border-color: #f0c840; }
  #hud .tok, #hud .shopbtn { pointer-events: auto; cursor: pointer; }
  #hud .shopbtn { border-color: #6a3a8a; color: #f0e0ff; }
  #hud .shopbtn:hover, #hud .tok:hover { filter: brightness(1.25); }
  #hud .shopbtn i { display: inline-block; width: 13px; height: 13px; vertical-align: -2px; background-size: 100% 100%; image-rendering: pixelated; }

  #legend { position: fixed; right: 8px; bottom: 8px; justify-content: flex-end; display: flex; flex-wrap: wrap; gap: 4px 10px; align-items: center;
    background: var(--ui-bg); border: 1px solid var(--ui-border); border-radius: 3px; padding: 3px 9px; font-size: 12px; pointer-events: none; max-width: 46vw; }
  #legend span { display: inline-flex; align-items: center; gap: 4px; }
  #legend i { width: 9px; height: 9px; display: inline-block; border-radius: 1px; }
  #legend em { color: var(--ui-dim); font-style: normal; font-size: 11px; }

  #tooltip, #card { position: fixed; left: 0; top: 0; z-index: 5; pointer-events: none; min-width: 180px; max-width: 320px;
    background: var(--ui-bg); border: 1px solid #5a5278; border-radius: 4px; padding: 6px 9px; box-shadow: 3px 3px 0 rgba(0,0,0,.35); font-size: 12px; }
  #card { left: auto; right: 8px; top: 8px; border-color: #fff; }
  #tooltip table, #card table { border-collapse: collapse; }
  #tooltip th, #card th { text-align: left; font-weight: 400; color: var(--ui-dim); padding: 1px 10px 1px 0; vertical-align: top; white-space: nowrap; }
  #tooltip td, #card td { padding: 1px 0; overflow-wrap: anywhere; }
  .title { font-weight: 600; margin-bottom: 4px; }
  .dim { color: var(--ui-dim); }
  .dot { display: inline-block; width: 8px; height: 8px; border-radius: 1px; margin-right: 5px; }

  #empty { position: fixed; left: 50%; top: 50%; transform: translate(-50%, -50%); background: var(--ui-bg); border: 1px solid var(--ui-border);
    padding: 8px 14px; border-radius: 4px; font-size: 14px; pointer-events: none; box-shadow: 3px 3px 0 rgba(0,0,0,.35); }
  #debug { position: fixed; right: 8px; bottom: 44px; max-width: 560px; background: rgba(0,0,0,.8); color: #9fe0a0; font: 11px/1.3 var(--mono);
    padding: 6px 8px; border-radius: 3px; pointer-events: none; z-index: 6; }
  #debug pre { margin: 4px 0 0; white-space: pre; overflow: hidden; }
  #atlas { position: fixed; inset: 0; overflow: auto; background: #2a2838; z-index: 10; display: flex; gap: 12px; padding: 12px; align-items: flex-start; }
  #atlas canvas { image-rendering: pixelated; background: #3a3850; }
  /* desktop (Electron): лента за местене на прозореца, видима при посочване */
  #winbar { display: none; }
  body.desktop #winbar { display: flex; position: fixed; left: 0; right: 0; top: 0; height: 24px; z-index: 20; align-items: center; gap: 2px;
    padding: 0 4px 0 10px; background: rgba(14, 10, 22, 0.88); border-bottom: 1px solid var(--ui-border); -webkit-app-region: drag; user-select: none;
    opacity: 0; transition: opacity .2s; font-size: 12px; color: var(--ui-dim); }
  body.desktop:hover #winbar { opacity: 1; }
  #winbar .grip { flex: 1; }
  #winbar button { -webkit-app-region: no-drag; width: 26px; height: 20px; border: 0; border-radius: 3px; background: transparent; color: var(--ui-text);
    font: 13px/20px var(--font); cursor: pointer; padding: 0; }
  #winbar button:hover { background: rgba(255,255,255,.12); }
  #winbar button.on { color: #e0c24a; }
  #winbar button[data-act="quit"]:hover { background: #e04a6b; }
  body.desktop #hud { left: 4px; bottom: 4px; gap: 3px; font-size: 11px; }
  body.desktop:has(#legend[hidden]) #hud { max-width: calc(100vw - 8px); } /* скрита легенда (по подразбиране в малкия прозорец) – целият ред е за HUD-а */
  body.desktop #hud span { padding: 1px 5px; }
  body.desktop #legend { right: 4px; bottom: 4px; font-size: 11px; }
  body.desktop #card { top: 30px; }
  /* в малкия прозорец HUD-ът се показва при посочване; червеното "чакат те" и токените остават винаги */
  /* сутрешен екран (?wait): сцената е отделен канвас над офиса, текстът е DOM лента долу */
  #morning { position: fixed; left: 0; top: 0; z-index: 15; image-rendering: pixelated; cursor: pointer; transition: opacity .6s; }
  #wait { position: fixed; left: 50%; bottom: 6px; transform: translateX(-50%); z-index: 16; max-width: calc(100vw - 16px); box-sizing: border-box;
    background: var(--ui-bg); border: 1px solid var(--ui-border); border-radius: 3px; padding: 2px 9px 3px; box-shadow: 2px 2px 0 rgba(0,0,0,.3);
    font-size: 12px; line-height: 15px; text-align: center; cursor: pointer; transition: opacity .6s; }
  #wait b { display: block; color: #ffe27a; }
  #wait span { color: var(--ui-text); white-space: nowrap; }
  #morning.gone, #wait.gone { opacity: 0; pointer-events: none; }
  body.waiting #hud, body.waiting #legend, body.waiting #empty, body.waiting #card, body.waiting #tooltip { visibility: hidden; }
  body.desktop #hud span { transition: opacity .2s; }
  body.desktop:not(:hover) #hud span:not(.alert):not(.tok):not(.shopbtn) { opacity: 0; }
  body.desktop #empty { font-size: 12px; padding: 5px 10px; }
  body.tiny .tag { font-size: 10px; line-height: 12px; padding: 0 4px 1px; gap: 3px; }
  body.tiny .tag i { width: 6px; height: 6px; }
  body.tiny .tag .s { display: none; }
  body.tiny .bubble { font-size: 10px; line-height: 12px; padding: 1px 4px 2px; border-width: 1px; }
  body.tiny .bubble.show:not([data-state="waiting"]):not(.hl) { opacity: 0; }
  #hud .tok { pointer-events: auto; cursor: pointer; }
  #hud .tok:hover { border-color: #f0c840; }
  #hud .lang { pointer-events: auto; cursor: pointer; color: var(--ui-dim); }
  #hud .lang:hover { color: #fff; border-color: #6b6b80; }
  /* звънче: звук вкл./изкл. */
  #hud .snd { pointer-events: auto; cursor: pointer; }
  #hud .snd:hover { filter: brightness(1.25); border-color: #6b6b80; }
  #hud .snd i { display: inline-block; width: 11px; height: 11px; vertical-align: -2px; background-size: 100% 100%; image-rendering: pixelated; }

  /* магазин */
  /* лента отдолу: офисът се смалява над нея (main.js), за да се вижда прегледът на посочения предмет */
  #shop { position: fixed; left: 0; right: 0; bottom: 0; z-index: 30; height: clamp(220px, 40vh, 380px); }
  .shop-panel { width: 100%; height: 100%; box-sizing: border-box; display: flex; flex-direction: column;
    background: #17121f; border-top: 2px solid #3a3452; box-shadow: 0 -4px 0 rgba(0,0,0,.35); }
  body.shopping #hud, body.shopping #legend, body.shopping #card, body.shopping #empty { visibility: hidden; }
  .shop-panel header, .shop-panel nav { padding-top: 4px; padding-bottom: 4px; }
  .shop-panel header { display: flex; align-items: center; gap: 10px; padding: 8px 10px; border-bottom: 1px solid #2c2640; }
  .shop-panel .ttl { font-size: 15px; }
  .shop-panel .bal { margin-left: auto; padding: 2px 8px; border: 1px solid #7a5410; border-radius: 3px; color: #ffe27a; font-weight: 600; }
  .shop-panel i[style] { display: inline-block; width: 10px; height: 10px; margin-right: 5px; vertical-align: -1px; background-size: 100% 100%; image-rendering: pixelated; }
  .shop-panel button { font: inherit; color: var(--ui-text); background: #2a2440; border: 1px solid #3a3452; border-radius: 3px; padding: 2px 8px; cursor: pointer; }
  .shop-panel button:hover:not(:disabled) { background: #3a3258; }
  .shop-panel button:disabled { opacity: .5; cursor: default; }
  .shop-panel .x { padding: 2px 7px; }
  .shop-panel nav { display: flex; flex-wrap: wrap; gap: 4px; padding: 6px 10px; border-bottom: 1px solid #2c2640; }
  .shop-panel nav button.on { background: #e0c24a; color: #1d1626; border-color: #e0c24a; }
  .shop-panel .body { flex: 1; overflow-y: auto; padding: 4px 10px 10px; }
  .shop-panel h3 { margin: 10px 0 6px; font-size: 12px; font-weight: 600; color: var(--ui-dim); text-transform: uppercase; letter-spacing: .04em; }
  .shop-panel .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(118px, 1fr)); gap: 6px; }
  .shop-panel .card { display: flex; flex-direction: column; align-items: center; gap: 3px; padding: 6px 4px; background: #1f1a2c; border: 1px solid #2c2640; border-radius: 3px; text-align: center; }
  .shop-panel .card:hover { border-color: #6b6b80; }
  .shop-panel .card.on { border-color: #4ac26b; box-shadow: inset 0 0 0 1px #4ac26b; }
  .shop-panel .th { image-rendering: pixelated; margin: 2px 0; }
  .shop-panel .avatar { display: flex; flex-wrap: wrap; gap: 16px; padding-top: 8px; }
  .shop-panel .avatar .pv { display: flex; gap: 8px; align-items: flex-start; }
  .shop-panel .avatar .pv canvas { border: 1px solid #2c2640; border-radius: 3px; }
  .shop-panel .avatar .opts { flex: 1; min-width: 220px; }
  .shop-panel .avatar .opts h3:first-child { margin-top: 0; }
  .shop-panel .avatar .sw { display: flex; flex-wrap: wrap; gap: 6px; }
  .shop-panel .avatar .sw button.on { background: #e0c24a; color: #1d1626; border-color: #e0c24a; }
  .shop-panel .avatar .sw button.dot { width: 24px; height: 24px; padding: 0; border: 2px solid #1d1626; box-shadow: 0 0 0 1px #3a3452; }
  .shop-panel .avatar .sw button.dot.on { border-color: #1d1626; box-shadow: 0 0 0 2px #e0c24a; }
  .shop-panel section > .hint { margin: 6px 0 0; font-size: 12px; color: var(--ui-dim); }
  .shop-panel section > .act { justify-content: flex-start; margin-top: 6px; }
  .shop-panel .avatar .hint { margin: 12px 0 0; font-size: 12px; color: var(--ui-dim); }
  .shop-panel .weather { padding-top: 8px; max-width: 560px; }
  .shop-panel .weather h3:first-child { margin-top: 0; }
  .shop-panel .weather .cur { margin: 0 0 10px; }
  .shop-panel .weather .find { display: flex; gap: 6px; margin-bottom: 8px; }
  .shop-panel .weather input { flex: 1; font: inherit; color: var(--ui-text); background: #0f0c16; border: 1px solid #3a3452; border-radius: 3px; padding: 3px 8px; }
  .shop-panel .weather .sw { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 8px; color: var(--ui-dim); font-size: 12px; }
  .shop-panel .weather .hint { margin: 12px 0 0; font-size: 12px; color: var(--ui-dim); }
  .shop-panel .nm { font-size: 12px; line-height: 14px; }
  .shop-panel .pr { font-size: 11px; color: #ffe27a; }
  .shop-panel .card.owned .pr { color: var(--ui-dim); }
  .shop-panel .act { display: flex; flex-wrap: wrap; justify-content: center; gap: 3px; }
  .shop-panel .act button { font-size: 11px; padding: 1px 6px; }
  .shop-panel .act button.buy:not(:disabled) { background: #e0c24a; color: #1d1626; border-color: #e0c24a; font-weight: 600; }
  .shop-panel .act button.on { background: #2e5a3a; border-color: #4ac26b; }
  .shop-panel footer { padding: 6px 10px; border-top: 1px solid #2c2640; color: var(--ui-dim); font-size: 11px; }
  .shop-panel footer.err { color: #ff9ab0; }
  .trophies { display: flex; flex-direction: column; gap: 4px; margin-top: 8px; }
  .trophy { display: flex; align-items: center; gap: 10px; padding: 5px 8px; background: #1f1a2c; border: 1px solid #2c2640; border-radius: 3px; }
  .trophy.got { border-color: #7a5410; }
  .trophy .ic { width: 27px; height: 27px; image-rendering: pixelated; flex: none; }
  .trophy .tx { flex: 1; display: flex; flex-direction: column; }
  .trophy .tx span { color: var(--ui-dim); font-size: 11px; }
  .trophy .pg { text-align: right; font-size: 11px; color: var(--ui-dim); white-space: nowrap; }
  .trophy.got .pg { color: #ffe27a; }
  .trophy .pg em { display: block; font-style: normal; color: #ffe27a; }
  .trophy .bar { display: inline-block; width: 70px; height: 5px; margin-right: 6px; background: #2c2640; vertical-align: 1px; }
  .trophy .bar i { display: block; height: 100%; background: #e0c24a; }
  /* известие за постижение */
  #toast { position: fixed; left: 50%; top: 34px; transform: translateX(-50%); z-index: 25; display: flex; flex-direction: column; align-items: center;
    padding: 6px 16px 8px; background: #2a1e08; border: 2px solid #f0c840; border-radius: 4px; box-shadow: 3px 3px 0 rgba(0,0,0,.45); pointer-events: none; animation: pop .3s ease-out; }
  #toast small { color: #f0c840; font-size: 11px; text-transform: uppercase; letter-spacing: .06em; }
  #toast b { font-size: 15px; color: #fff; }
  #toast span { font-size: 12px; color: #e8d8a8; }
  @keyframes pop { from { transform: translateX(-50%) scale(.8); opacity: 0; } }
  body.desktop .shop-panel .grid { grid-template-columns: repeat(auto-fill, minmax(104px, 1fr)); }
  /* статистика */
  .shop-panel .stats { padding-top: 4px; max-width: 760px; }
  .shop-panel .stats .cards { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 6px; }
  .shop-panel .stats .stat { display: flex; flex-direction: column; gap: 1px; padding: 8px 10px; background: #1f1a2c; border: 1px solid #2c2640; border-radius: 3px; }
  .shop-panel .stats .stat b { font-size: 18px; color: #fff; font-variant-numeric: tabular-nums; }
  .shop-panel .stats .stat span { font-size: 12px; color: var(--ui-text); }
  .shop-panel .stats .stat small { font-size: 11px; color: var(--ui-dim); }
  .shop-panel .stats .bars { display: flex; gap: 6px; align-items: flex-end; height: 92px; padding: 4px 0; }
  .shop-panel .stats .day { flex: 1; display: flex; flex-direction: column; align-items: center; gap: 3px; height: 100%; min-width: 0; }
  .shop-panel .stats .stack { flex: 1; width: 100%; max-width: 36px; display: flex; flex-direction: column-reverse; background: #1f1a2c; border-radius: 2px; overflow: hidden; }
  .shop-panel .stats .stack i { display: block; }
  .shop-panel .stats .stack .w { background: #4ac26b; }
  .shop-panel .stats .stack .q { background: #e04a6b; }
  .shop-panel .stats .day span { font-size: 10px; color: var(--ui-dim); font-variant-numeric: tabular-nums; }
  .shop-panel .stats table.proj { border-collapse: collapse; width: 100%; margin-top: 10px; font-size: 12px; }
  .shop-panel .stats .proj th { text-align: left; color: var(--ui-dim); font-weight: 600; padding: 3px 8px 3px 0; border-bottom: 1px solid #2c2640; }
  .shop-panel .stats .proj td { padding: 3px 8px 3px 0; border-bottom: 1px solid #221c30; overflow-wrap: anywhere; }
  .shop-panel .stats .proj td.n { font-variant-numeric: tabular-nums; white-space: nowrap; }
  .shop-panel .stats .sw { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 10px; }
  .shop-panel .stats a.btn { font-size: 12px; color: var(--ui-text); background: #2a2440; border: 1px solid #3a3452; border-radius: 3px; padding: 2px 8px; text-decoration: none; }
  .shop-panel .stats a.btn:hover { background: #3a3258; }
  .shop-panel .stats .hint { margin: 8px 0 0; font-size: 12px; color: var(--ui-dim); }
  #hud .statsbtn { pointer-events: auto; cursor: pointer; }
  #hud .statsbtn:hover { filter: brightness(1.25); border-color: #6b6b80; }
  #hud .statsbtn i { display: inline-block; width: 11px; height: 11px; vertical-align: -2px; background-size: 100% 100%; image-rendering: pixelated; }
  /* любимци: име */
  .shop-panel .pname { display: flex; gap: 6px; margin: 0 0 8px; max-width: 320px; }
  .shop-panel .pname input, #setup input { flex: 1; min-width: 0; font: inherit; color: var(--ui-text); background: #0f0c16; border: 1px solid #3a3452; border-radius: 3px; padding: 3px 8px; }

  /* начална настройка (първо пускане) */
  #setup { position: fixed; inset: 0; z-index: 40; display: flex; align-items: center; justify-content: center; padding: 8px; box-sizing: border-box;
    background: rgba(8, 6, 14, 0.55); }
  body.setting-up #hud, body.setting-up #legend, body.setting-up #card, body.setting-up #empty, body.setting-up #tooltip { visibility: hidden; }
  .setup-panel { width: 100%; max-width: 440px; max-height: 100%; overflow-y: auto; box-sizing: border-box; padding: 14px 16px 12px;
    background: #17121f; border: 2px solid #3a3452; border-radius: 4px; box-shadow: 4px 4px 0 rgba(0,0,0,.45); }
  .setup-panel h2 { margin: 0 0 2px; font-size: 17px; color: #ffe27a; }
  .setup-panel h3 { margin: 12px 0 6px; font-size: 12px; font-weight: 600; color: var(--ui-dim); text-transform: uppercase; letter-spacing: .04em; }
  .setup-panel p { margin: 0; }
  .setup-panel .hint { margin-top: 8px; font-size: 12px; color: var(--ui-dim); }
  .setup-panel button { font: inherit; color: var(--ui-text); background: #2a2440; border: 1px solid #3a3452; border-radius: 3px; padding: 3px 10px; cursor: pointer; }
  .setup-panel button:hover:not(:disabled) { background: #3a3258; }
  .setup-panel button:disabled { opacity: .5; cursor: default; }
  .setup-panel .pick { display: flex; gap: 10px; }
  .setup-panel .pick button { flex: 1; display: flex; flex-direction: column; align-items: center; gap: 4px; padding: 8px; background: #1f1a2c; border-color: #2c2640; }
  .setup-panel .pick button.on { border-color: #4ac26b; box-shadow: inset 0 0 0 1px #4ac26b; background: #1f2a24; }
  .setup-panel .pick canvas { image-rendering: pixelated; }
  .setup-panel .modes { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .setup-panel .modes button { display: flex; flex-direction: column; gap: 4px; align-items: flex-start; text-align: left; padding: 10px 12px; background: #1f1a2c; border-color: #2c2640; }
  .setup-panel .modes button b { font-size: 15px; }
  .setup-panel .modes button span { font-size: 12px; color: var(--ui-dim); line-height: 1.4; }
  .setup-panel .modes button.on { border-color: #4ac26b; box-shadow: inset 0 0 0 1px #4ac26b; background: #1f2a24; }
  @media (max-width: 420px) { .setup-panel .modes { grid-template-columns: 1fr; } }
  .setup-panel .nm { display: flex; align-items: center; gap: 8px; margin-top: 10px; }
  .setup-panel .find { display: flex; gap: 6px; }
  .setup-panel .list { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 8px; color: var(--ui-dim); font-size: 12px; }
  .setup-panel .list button.on { background: #e0c24a; color: #1d1626; border-color: #e0c24a; }
  .setup-panel .chosen { margin-top: 8px; min-height: 17px; }
  .setup-panel .nav { display: flex; align-items: center; justify-content: space-between; margin-top: 14px; }
  .setup-panel .nav .go { background: #e0c24a; color: #1d1626; border-color: #e0c24a; font-weight: 600; }
  .setup-panel .err { margin-top: 6px; color: #ff9ab0; font-size: 12px; }
  .setup-panel .err:empty { display: none; }
  /* форма на точката според състоянието (освен цвета – за далтонисти и малкия прозорец):
     почива ● · мисли ◆ · пише ■ · чете ▬ · изпълнява ▶ · делегира ✚ · чака теб ▲ */
  .tag i, #legend i, .dot, #help li i { flex: none; }
  .tag[data-state="idle"] i, #legend [data-state="idle"] i, .dot[data-state="idle"], #help [data-state="idle"] i { border-radius: 50%; }
  .tag[data-state="thinking"] i, #legend [data-state="thinking"] i, .dot[data-state="thinking"], #help [data-state="thinking"] i { clip-path: polygon(50% 0, 100% 50%, 50% 100%, 0 50%); }
  .tag[data-state="reading"] i, #legend [data-state="reading"] i, .dot[data-state="reading"], #help [data-state="reading"] i { clip-path: inset(22% 0); }
  .tag[data-state="running"] i, #legend [data-state="running"] i, .dot[data-state="running"], #help [data-state="running"] i { clip-path: polygon(8% 0, 100% 50%, 8% 100%); }
  .tag[data-state="delegating"] i, #legend [data-state="delegating"] i, .dot[data-state="delegating"], #help [data-state="delegating"] i { clip-path: polygon(35% 0, 65% 0, 65% 35%, 100% 35%, 100% 65%, 65% 65%, 65% 100%, 35% 100%, 35% 65%, 0 65%, 0 35%, 35% 35%); }
  .tag[data-state="waiting"] i, #legend [data-state="waiting"] i, .dot[data-state="waiting"], #help [data-state="waiting"] i { clip-path: polygon(50% 0, 100% 100%, 0 100%); }
  .tag i { width: 8px; height: 8px; }
  .tag[data-state="waiting"] i { background: #fff !important; }

  /* помощ (?): какво значат цветовете + настройки */
  #hud .help { pointer-events: auto; cursor: pointer; font-weight: 700; color: var(--ui-dim); }
  #hud .help:hover { color: #fff; border-color: #6b6b80; }
  #help { position: fixed; inset: 0; z-index: 35; display: flex; align-items: center; justify-content: center; padding: 8px; box-sizing: border-box; background: rgba(8, 6, 14, 0.45); }
  .help-panel { width: 100%; max-width: 460px; max-height: 100%; overflow-y: auto; box-sizing: border-box; padding: 12px 16px 14px; background: #17121f; border: 2px solid #3a3452; border-radius: 4px; box-shadow: 4px 4px 0 rgba(0,0,0,.45); }
  .help-panel header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 8px; font-size: 15px; }
  .help-panel button { font: inherit; color: var(--ui-text); background: #2a2440; border: 1px solid #3a3452; border-radius: 3px; padding: 1px 8px; cursor: pointer; }
  .help-panel ul { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 6px; }
  .help-panel li { display: flex; gap: 8px; align-items: baseline; font-size: 13px; }
  .help-panel li i { width: 9px; height: 9px; display: inline-block; }
  .help-panel p { margin: 10px 0 0; font-size: 12px; }
  .help-panel h3 { margin: 12px 0 6px; font-size: 12px; font-weight: 600; color: var(--ui-dim); text-transform: uppercase; letter-spacing: .04em; }
  .help-panel label { display: flex; gap: 8px; align-items: flex-start; padding: 6px 0; cursor: pointer; font-size: 13px; }
  .help-panel label small { display: block; color: var(--ui-dim); font-size: 12px; }
  .help-panel input { margin-top: 3px; }
  .help-panel .share { display: flex; gap: 6px; flex-wrap: wrap; }
  .help-panel .share a { font-size: 12px; color: var(--ui-text); background: #2a2440; border: 1px solid #3a3452; border-radius: 3px; padding: 2px 8px; text-decoration: none; }
  .help-panel .share a:hover, .help-panel button:hover { background: #3a3258; }
  .help-panel .pair { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; }
  .help-panel .pair label { border: 1px solid #2c2640; border-radius: 3px; padding: 6px 8px; background: #1f1a2c; }
  .help-panel .pair label:has(input:checked) { border-color: #4ac26b; box-shadow: inset 0 0 0 1px #4ac26b; }
  .help-panel .lang { display: flex; align-items: center; gap: 12px; font-size: 13px; padding: 4px 0; }
  .help-panel .lang label { padding: 0; align-items: center; }
  .help-panel details { margin-top: 12px; }
  .help-panel details summary { cursor: pointer; font-size: 12px; font-weight: 600; color: var(--ui-dim); text-transform: uppercase; letter-spacing: .04em; margin-bottom: 6px; }
  @media (max-width: 420px) { .help-panel .pair { grid-template-columns: 1fr; } }

  /* картата при фокус: бутон „Преименувай“ */
  #card { pointer-events: auto; }
  #card .ren { margin-top: 6px; display: flex; gap: 4px; flex-wrap: wrap; }
  #card .hist { margin-top: 6px; padding-top: 5px; border-top: 1px solid #3a3452; max-height: 150px; overflow-y: auto; font-size: 11px; }
  #card .hist > b { display: block; color: var(--ui-dim); font-weight: 600; margin-bottom: 2px; }
  #card .hist div { display: grid; grid-template-columns: auto auto minmax(0, 1fr) auto; gap: 6px; align-items: baseline; }
  #card .hist .t { color: var(--ui-dim); font-variant-numeric: tabular-nums; white-space: nowrap; }
  #card .hist .d { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-family: var(--mono); }
  #card .ren button { font: inherit; font-size: 11px; color: var(--ui-text); background: #2a2440; border: 1px solid #3a3452; border-radius: 3px; padding: 1px 8px; cursor: pointer; }
  #card .ren input { width: 100%; box-sizing: border-box; font: inherit; color: var(--ui-text); background: #0f0c16; border: 1px solid #3a3452; border-radius: 3px; padding: 2px 6px; }

  #note { position: fixed; left: 50%; bottom: 44px; transform: translateX(-50%); z-index: 36; max-width: calc(100vw - 24px); box-sizing: border-box; padding: 5px 12px;
    background: var(--ui-bg); border: 1px solid #5a5278; border-radius: 3px; box-shadow: 2px 2px 0 rgba(0,0,0,.35); font-size: 12px; pointer-events: none; }
  body.strip #note { bottom: 4px; }
  #strip .row { cursor: pointer; }
  /* тънка лента (?strip): по един ред на сесия вместо офиса */
  body.strip #stage, body.strip #hud, body.strip #legend, body.strip #empty, body.strip #tooltip, body.strip #card, body.strip #toast { display: none !important; }
  body.strip #winbar { display: none; }
  #strip { position: fixed; left: 0; right: 0; bottom: 0; display: flex; flex-direction: column; gap: 2px; padding: 6px 6px 4px; box-sizing: border-box; background: #14101c; border-top: 3px solid #2c2640; -webkit-app-region: drag; user-select: none; }
  #strip .row { display: grid; grid-template-columns: 9px minmax(0, 1fr) minmax(0, 1.2fr) auto; gap: 7px; align-items: center; padding: 3px 6px; border-radius: 3px; background: #1f1a2c; font-size: 12px; line-height: 16px; -webkit-app-region: no-drag; }
  #strip .row i { width: 9px; height: 9px; }
  #strip .row b { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  #strip .row .what { color: var(--ui-dim); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-family: var(--mono); font-size: 11px; }
  #strip .row .time { color: var(--ui-dim); font-size: 11px; font-variant-numeric: tabular-nums; white-space: nowrap; }
  #strip .row.wait { background: #e04a6b; animation: pulse .64s steps(2) infinite; }
  #strip .row.wait .what, #strip .row.wait .time { color: #fff; }
  #strip .row.wait i { background: #fff !important; }
  #strip .none { padding: 4px 6px; font-size: 12px; color: var(--ui-dim); -webkit-app-region: no-drag; }
  #strip .row[data-state="idle"] i { border-radius: 50%; }
  #strip .row[data-state="thinking"] i { clip-path: polygon(50% 0, 100% 50%, 50% 100%, 0 50%); }
  #strip .row[data-state="reading"] i { clip-path: inset(22% 0); }
  #strip .row[data-state="running"] i { clip-path: polygon(8% 0, 100% 50%, 8% 100%); }
  #strip .row[data-state="delegating"] i { clip-path: polygon(35% 0, 65% 0, 65% 35%, 100% 35%, 100% 65%, 65% 65%, 65% 100%, 35% 100%, 35% 65%, 0 65%, 0 35%, 35% 35%); }
  #strip .row[data-state="waiting"] i { clip-path: polygon(50% 0, 100% 100%, 0 100%); }

  /* ?overlay (OBS/стрийм): само сцената */
  body.overlay #hud, body.overlay #legend, body.overlay #winbar, body.overlay #empty, body.overlay #card, body.overlay #tooltip { display: none !important; }
  [hidden] { display: none !important; }
</style>
</head>
<body>
<div id="stage">
  <canvas id="c" width="420" height="250"></canvas>
  <div id="overlay"></div>
</div>
<div id="hud"></div>
<div id="legend"></div>
<div id="tooltip" hidden></div>
<div id="card" hidden></div>
<div id="empty" hidden></div>
<div id="debug" hidden></div>
<div id="shop" hidden></div>
<div id="toast" hidden></div>
<div id="winbar"><span class="grip">Cubicle Crew</span><button data-act="settings" title="Настройки (размер, известия, демо…)">⚙</button><button data-act="pin" title="Винаги отгоре">▲</button><button data-act="through" title="Кликовете минават през прозореца (махни от менюто в трея)">◌</button><button data-act="hide" title="Скрий в трея">–</button><button data-act="quit" title="Затвори">✕</button></div>
<script type="module" src="main.js"></script>
</body>
</html>
